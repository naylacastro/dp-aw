<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferência de Estilo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Preferência de Estilo</h1>
        <p>Conte um pouco sobre seu estilo pessoal!</p>
    </header>

    <main>
        <div class="form-card">
            <form>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Seu e-mail" required>

                <label for="estilo">Tipo de Estilo Preferido</label>
                <select id="estilo" name="estilo" required>
                    <option value="">Selecione...</option>
                    <option value="casual">Casual</option>
                    <option value="elegante">Elegante</option>
                    <option value="street">Street</option>
                    <option value="boho">Boho</option>
                    <option value="outro">Outro</option>
                </select>

                <label for="cor">Cor Favorita</label>
                <input type="text" id="cor" name="cor" placeholder="Ex : Rosa, Azul, Creme">

                <label for="comentario">Comentário</label>
                <textarea id="comentario" name="comentario" rows="4" placeholder="Conte aqui algo sobre seu estilo"></textarea>

                <button type="submit">Enviar</button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2025</p>
        <p> Feito por Ana Nayla ♡</p>
    </footer>
</body>
</html>
