<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal do Estudante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="container">
        <h1>Portal do Estudante</h1>

        <nav aria-label="Menu principal">
            <a href="#">Início</a>
            <a href="#">Cursos</a>
            <a href="#">Agenda</a>
            <a href="#">Contato</a>
        </nav>
    </div>
</header>

<main class="container">

    <section class="bloco-principal">

        <div class="boas-vindas">
            <h2>Bem-vindo</h2>
            <p>
                Este espaço reúne informações importantes para o dia a dia acadêmico,
                como avisos, datas e acesso rápido aos serviços.
            </p>
            <button>Entrar no sistema</button>
        </div>

        <div class="avisos">
            <h3>Avisos!</h3>
            <p>As aulas seguem normalmente esta semana.</p>
            <a href="#" class="link-avisos">Ver avisos</a>
        </div>

    </section>

</main>

<footer>
    <p>Portal do Estudante — 2026</p>
</footer>

</body>
</html>
