<!DOCTYPE html>
<html lang="pt-BR">
<head>

                </tr>
                <tr>
                    <td>Esmalte</td>

                </tr>
                <tr>
                    <td>Sombras</td>

                </tr>
                <tr>
                    <td>Delineador</td>

                </tr>

        </table>

    <footer>
        <p> Feito por Ana Nayla ♡</p>
    </footer>

</html>
